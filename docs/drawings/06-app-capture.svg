<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#f6f1e8" stroke="none" stroke-width="0"/><text x="80" y="68" font-family="Noto Sans CJK SC" font-size="22" fill="#0f766e" font-weight="700" text-anchor="start">FITME · 图纸 6 / 6</text><text x="80" y="126" font-family="Noto Sans CJK SC" font-size="46" fill="#1c1917" font-weight="700" text-anchor="start">App 页面 · 拍照建档（阶段 2，现在不写）</text><text x="80" y="176" font-family="Noto Sans CJK SC" font-size="24" fill="#57534e" font-weight="400" text-anchor="start">先把选码跑通再做这条。画出来只为对齐：一个人、靠墙、不填厘米、不留原图。</text><rect x="72" y="218" width="1776" height="52" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="104" y="252" font-family="Noto Sans CJK SC" font-size="22" fill="#92400e" font-weight="600" text-anchor="start">阶段 2 才做 · 这一刀不许开工 · 画稿仅供对齐</text><rect x="72" y="300" width="330" height="700" rx="34" fill="#292524" stroke="none" stroke-width="0"/><rect x="88" y="324" width="298" height="652" rx="20" fill="#f7f8f7" stroke="none" stroke-width="0"/><text x="110" y="380" font-family="Noto Sans CJK SC" font-size="24" fill="#1c1917" font-weight="700" text-anchor="start">1  换贴身衣服</text><text x="110" y="434" font-family="Noto Sans CJK SC" font-size="16" fill="#57534e" font-weight="400" text-anchor="start">· 贴身短袖 / 运动背心</text><text x="110" y="468" font-family="Noto Sans CJK SC" font-size="16" fill="#57534e" font-weight="400" text-anchor="start">· 紧身裤或薄打底</text><text x="110" y="502" font-family="Noto Sans CJK SC" font-size="16" fill="#57534e" font-weight="400" text-anchor="start">· 外套、宽松卫衣请换掉</text><rect x="110" y="574" width="254" height="160" rx="14" fill="#ecfdf5" stroke="none" stroke-width="0"/><circle cx="237.0" cy="636" r="26" fill="#c5b8a8"/><rect x="211.0" y="668" width="52" height="48" rx="14" fill="#c5b8a8" stroke="none" stroke-width="0"/><rect x="110" y="764" width="254" height="46" rx="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="237.0" y="794" font-family="Noto Sans CJK SC" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">下一步</text><text x="110" y="854" font-family="Noto Sans CJK SC" font-size="14" fill="#9f1239" font-weight="600" text-anchor="start">禁止裸体或仅内衣</text><text x="237.0" y="1050" font-family="Noto Sans CJK SC" font-size="22" fill="#57534e" font-weight="400" text-anchor="middle">换装</text><rect x="435" y="300" width="330" height="700" rx="34" fill="#292524" stroke="none" stroke-width="0"/><rect x="451" y="324" width="298" height="652" rx="20" fill="#f7f8f7" stroke="none" stroke-width="0"/><text x="473" y="380" font-family="Noto Sans CJK SC" font-size="24" fill="#1c1917" font-weight="700" text-anchor="start">2  手机靠墙</text><text x="473" y="434" font-family="Noto Sans CJK SC" font-size="16" fill="#57534e" font-weight="400" text-anchor="start">· 镜头对着空地</text><text x="473" y="468" font-family="Noto Sans CJK SC" font-size="16" fill="#57534e" font-weight="400" text-anchor="start">· 填身高（唯一要敲的）</text><text x="473" y="502" font-family="Noto Sans CJK SC" font-size="16" fill="#57534e" font-weight="400" text-anchor="start">· 不用别人帮忙按快门</text><rect x="473" y="574" width="254" height="160" rx="14" fill="#ecfdf5" stroke="none" stroke-width="0"/><circle cx="600.0" cy="636" r="26" fill="#c5b8a8"/><rect x="574.0" y="668" width="52" height="48" rx="14" fill="#c5b8a8" stroke="none" stroke-width="0"/><rect x="473" y="764" width="254" height="46" rx="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="600.0" y="794" font-family="Noto Sans CJK SC" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">下一步</text><text x="473" y="854" font-family="Noto Sans CJK SC" font-size="14" fill="#9f1239" font-weight="600" text-anchor="start">体重可填可不填</text><text x="600.0" y="1050" font-family="Noto Sans CJK SC" font-size="22" fill="#57534e" font-weight="400" text-anchor="middle">靠墙 + 身高</text><rect x="798" y="300" width="330" height="700" rx="34" fill="#292524