y="Noto Sans CJK SC" font-size="24" fill="#1c1917" font-weight="700" text-anchor="start">5  完成</text><text x="1562" y="434" font-family="Noto Sans CJK SC" font-size="16" fill="#57534e" font-weight="400" text-anchor="start">· 端侧糊脸后才上传</text><text x="1562" y="468" font-family="Noto Sans CJK SC" font-size="16" fill="#57534e" font-weight="400" text-anchor="start">· 反解完即删原图</text><text x="1562" y="502" font-family="Noto Sans CJK SC" font-size="16" fill="#57534e" font-weight="400" text-anchor="start">· 首页变成「可推荐」</text><rect x="1562" y="574" width="254" height="160" rx="14" fill="#ecfdf5" stroke="none" stroke-width="0"/><circle cx="1689.0" cy="636" r="26" fill="#c5b8a8"/><rect x="1663.0" y="668" width="52" height="48" rx="14" fill="#c5b8a8" stroke="none" stroke-width="0"/><rect x="1562" y="764" width="254" height="46" rx="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="1689.0" y="794" font-family="Noto Sans CJK SC" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">下一步</text><text x="1562" y="854" font-family="Noto Sans CJK SC" font-size="14" fill="#9f1239" font-weight="600" text-anchor="start">业务库不存原图</text><text x="1689.0" y="1050" font-family="Noto Sans CJK SC" font-size="22" fill="#57534e" font-weight="400" text-anchor="middle">完成即删图</text><rect x="72" y="1000" width="1776" height="56" rx="14" fill="#fffdf8" stroke="#e7e5e4" stroke-width="2"/><text x="104" y="1036" font-family="Noto Sans CJK SC" font-size="22" fill="#57534e" font-weight="400" text-anchor="start">客户全程只敲一个数：身高。厘米数由模型算，不由用户填。</text></svg>