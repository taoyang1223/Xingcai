<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#f6f1e8" stroke="none" stroke-width="0"/><text x="80" y="68" font-family="Noto Sans CJK SC" font-size="22" fill="#0f766e" font-weight="700" text-anchor="start">FITME · 图纸 8 / 8</text><text x="80" y="126" font-family="Noto Sans CJK SC" font-size="46" fill="#1c1917" font-weight="700" text-anchor="start">App 页面 · 人台可看、可捏，但只给三个杆</text><text x="80" y="176" font-family="Noto Sans CJK SC" font-size="24" fill="#57534e" font-weight="400" text-anchor="start">首页不放灰色空图标，直接放一具标准人台，让人拖成自己的样子。捏人代替填表。</text><rect x="80" y="236" width="340" height="720" rx="32" fill="#1c1917" stroke="none" stroke-width="0"/><rect x="96" y="258" width="308" height="676" rx="20" fill="#f7f8f7" stroke="none" stroke-width="0"/><text x="116" y="302" font-family="Noto Sans CJK SC" font-size="20" fill="#1c1917" font-weight="700" text-anchor="start">今天适不适合</text><circle cx="370" cy="294" r="14" fill="#e7eeec" stroke="none" stroke-width="0"/><rect x="116" y="322" width="268" height="232" rx="18" fill="#ecfdf5" stroke="none" stroke-width="0"/><ellipse cx="194" cy="514.64" rx="40.480000000000004" ry="8.280000000000001" fill="#0f766e" opacity="0.1"/><ellipse cx="194" cy="358.24" rx="13.8" ry="17.48" fill="#ddd6ce" opacity="0.55"/><rect x="190.32" y="374.8" width="7.36" height="11.040000000000001" rx="2.7600000000000002" fill="#ddd6ce" stroke="none" stroke-width="0"/><rect x="166.4" y="384.0" width="55.2" height="9.200000000000001" rx="4.6000000000000005" fill="#ddd6ce" stroke="none" stroke-width="0"/><path d="M 171.92 387.68 C 166.4 424.48, 170.07999999999998 439.2, 175.6 452.08 L 212.4 452.08 C 217.92000000000002 439.2, 221.6 424.48, 216.08 387.68 Z" fill="#ddd6ce" opacity="1.0"/><rect x="164.56" y="389.52" width="10.120000000000001" height="49.68" rx="4.6000000000000005" fill="#ddd6ce" stroke="none" stroke-width="0"/><rect x="213.32" y="389.52" width="10.12000000