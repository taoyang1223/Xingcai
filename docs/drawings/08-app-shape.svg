 font-weight="400" text-anchor="middle">试穿</text><text x="288.5" y="916" font-family="Noto Sans CJK SC" font-size="13" fill="#a8a29e" font-weight="400" text-anchor="middle">档案</text><text x="365.5" y="916" font-family="Noto Sans CJK SC" font-size="13" fill="#a8a29e" font-weight="400" text-anchor="middle">我的</text><text x="250.0" y="1000" font-family="Noto Sans CJK SC" font-size="22" fill="#0f766e" font-weight="700" text-anchor="middle">① 首页 · 人台先亮相</text><text x="250.0" y="1026" font-family="Noto Sans CJK SC" font-size="15" fill="#a8a29e" font-weight="400" text-anchor="middle">不放灰色空图标</text><rect x="460" y="236" width="340" height="720" rx="32" fill="#1c1917" stroke="none" stroke-width="0"/><rect x="476" y="258" width="308" height="676" rx="20" fill="#f7f8f7" stroke="none" stroke-width="0"/><text x="496" y="288" font-family="Noto Sans CJK SC" font-size="13" fill="#0f766e" font-weight="400" text-anchor="start">返回</text><text x="496" y="320" font-family="Noto Sans CJK SC" font-size="21" fill="#1c1917" font-weight="700" text-anchor="start">调成你的样子</text><rect x="496" y="336" width="268" height="210" rx="16" fill="#f0fdfa" stroke="none" stroke-width="0"/><ellipse cx="630.0" cy="517.12" rx="37.839999999999996" ry="7.74" fill="#0f766e" opacity="0.1"/><ellipse cx="630.0" cy="370.92" rx="12.9" ry="16.34" fill="#c5b8a8" opacity="0.55"/><rect x="626.56" y="386.4" width="6.88" height="10.32" rx="2.58" fill="#c5b8a8" stroke="none" stroke-width="0"/><rect x="604.2" y="395.0" width="51.6" height="8.6" rx="4.3" fill="#c5b8a8" stroke="none" stroke-width="0"/><path d="M 606.8832 398.44 C 600.33 432.84, 604.2860000000001 446.6, 612.8 458.64 L 647.2 458.64 C 655.7139999999999 446.6, 659.67 432.84, 653.1168 398.44 Z" fill="#c5b8a8" opacity="1.0"/><rect x="602.48" y="400.16" width="9.459999999999999" height="46.44" rx="4.3" fill="#c5b8a8" stroke="none" stroke-width="0"/><rect x="648.06" y="400.16" width="9.459999999999999" height="46.44" rx="4.3" fill="#c5b8a8" stroke="none" stroke-width="0"/><rect x="613.66" y="456.92" width="15.411200000000001" height="53.32" rx="6.02" fill="#c5b8a8" stroke="none" stroke-width="0"/><rect x="632.58" y="456.92" width="15.411200000000001" height="53.32" rx="6.02" fill="#c5b8a8" stroke="none" stroke-width="0"/><text x="504" y="358" font-family="Noto Sans CJK SC" font-size="12" fill="#a8a29e" font-weight="400" text-anchor="start">无头人台</text><rect x="688" y="348" width="68" height="24" rx="12" fill="#e7e5e4" stroke="none" stroke-width="0"/><text x="722" y="365" font-family="Noto Sans CJK SC" font-size="11" fill="#a8a29e" font-weight="400" text-anchor="middle">转一转 →</text><text x="722" y="390" font-family="Noto Sans CJK SC" font-size="11" fill="#a8a29e" font-weight="400" text-anchor="middle">阶段 4</text><text x="496" y="574" font-family="Noto Sans CJK SC" font-size="13" fill="#a8a29e" font-weight="400" text-anchor="start">身高（厘米）</text><rect x="496" y="584" width="268" height="38" rx="10" fill="#fff" stroke="#e7e5e4" stroke-width="2"/><text x="508" y="609" font-family="Noto Sans CJK SC" font-size="16" fill="#1c1917" font-weight="400" text-anchor="start">170</text><text x="496" y="658" font-family="Noto Sans CJK SC" font-size="15" fill="#1c1917" font-weight="600" text-anchor="start">整体胖瘦</text><text x="764" y="658" font-family="Noto Sans CJK SC" font-size="14" fill="#0f766e" font-weight="600" text-anchor="end">偏胖一点</text><rect x="496" y="672" width="268" height="8" rx="4" fill="#e7e5e4" stroke="none" stroke-width="0"/><rect x="496" y="672" width="166.16" height="8" rx="4" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="662.16" cy="676" r="13" fill="#fff" stroke="#0f766e" stroke-width="3"/><text x="496" y="716" font-family="Noto Sans CJK SC" font-size="15" fill="#1c1917" font-weight="600" text-anchor="start">肚子</text><text x="764" y="716" font-family="Noto Sans CJK SC" font-size="14" fill="#0f766e" font-weight="600" text-anchor="end">有一点</text><rect x="496" y="730" width="268" height="8" rx="4" fill="#e7e5e4" stroke="none" stroke-width="0"/><rect x="496" y="730" width="147.4" height="8" rx="4" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="643.4" cy="734" r="13" fill="#fff" stroke="#0f766e" stroke-width="3"/><text x="496" y="774" font-family="Noto Sans CJK SC" font-size="15" fill="#1c1917" font-weight="600" text-anchor="start">肩宽</text><text x="764" y="774" font-family="Noto Sans CJK SC" font-size="14" fill="#0f766e" font-weight="600" text-anchor="end">偏窄</text><rect x="496" y="788" width="268" height="8" rx="4" fill="#e7e5e4" stroke="none" stroke-width="0"/><rect x="496" y="788" width="101.84" height="8" rx="4" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="597.84" cy="792" r="13" fill="#fff" stroke="#0f766e" stroke-width="3"/><rect x="496" y="832" width="268" height="44" rx="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="630.0" y="860" font-family="Noto Sans CJK SC" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">像了，存成我的人台</text><text x="630.0" y="898" font-family="Noto Sans CJK SC" font-size="12" fill="#a8a29e" font-weight="400" text-anchor="middle">不用回忆腰围是 81 还是 84</text><text x="630.0" y="1000" font-family="Noto Sans CJK SC" font-size="22" fill="#0f766e" font-weight="700" text-anchor="middle">② 捏人 · 只有三个杆</text><text x="630.0" y="1026" font-family="Noto Sans CJK SC" font-size="15" fill="#0f766e" font-weight="400" text-anchor="middle">代替填身高体重表单</text><rect x="840" y="236" width="340" height="720" rx="32" fill="#1c1917" stroke="none" stroke-width="0"/><rect x="856" y="258" width="308" height="676" rx="20" fill="#f7f8f7" stroke="none" stroke-width="0"/><text x="876" y="302" font-family="Noto Sans CJK SC" font-size="20" fill="#1c1917" font-weight="700" text-anchor="start">今天适不适合</text><circle cx="1130" cy="294" r="14" fill="#e7eeec" stroke="none" stroke-width="0"/><rect x="876" y="322" width="268" height="232" rx="18" fill="#ecfdf5" stroke="none" stroke-width="0"/><ellipse cx="954" cy="514.64" rx="40.480000000000004" ry="8.280000000000001" fill="#0f766e" opacity="0.1"/><ellipse cx="954" cy="358.24" rx="13.8" ry="17.48" fill="#c5b8a8" opacity="0.55"/><rect x="950.32" y="374.8" width="7.36" height="11.040000000000001" rx="2.7600000000000002" fill="#c5b8a8" stroke="none" stroke-width="0"/><rect x="926.4" y="384.0" width="55.2" height="9.200000000000001" rx="4.6000000000000005" fill="#c5b8a8" stroke="none" stroke-width="0"/><path d="M 929.2704 387.68 C 922.26 424.48, 926.492 439.2, 935.6 452.08 L 972.4 452.08 C 981.508 439.2, 985.74 424.48, 978.7296 387.68 Z" fill="#c5b8a8" opacity="1.0"/><rect x="924.56" y="389.52" width="10.120000000000001" height="49.68" rx="4.6000000000000005" fill="#c5b8a8" stroke="none" stroke-width="0"/><rect x="973.32" y="389.52" width="10.120000000000001" height="49.68" rx="4.6000000000000005" fill="#c5b8a8" stroke="none" stroke-width="0"/><rect x="936.52" y="450.24" width="16.486400000000003" height="57.04" rx="6.44" fill="#c5b8a8" stroke="none" stroke-width="0"/><rect x="956.76" y="450.24" width="16.486400000000003" height="57.04" rx="6.44" fill="#c5b8a8" stroke="none" stroke-width="0"/><text x="1026" y="382" font-family="Noto Sans CJK SC" font-size="16" fill="#1c1917" font-weight="700" text-anchor="start">我的人台</text><rect x="1026" y="396" width="130" height="24" rx="12" fill="#b45309" stroke="none" stroke-width="0"/><text x="1091" y="413" font-family="Noto Sans CJK SC" font-size="12" fill="#fff" font-weight="600" text-anchor="middle">弱档 · 像了就行</text><text x="1026" y="444" font-family="Noto Sans CJK SC" font-size="12" fill="#57534e" font-weight="400" text-anchor="start">拍照后会更准</text><text x="1026" y="466" font-family="Noto Sans CJK SC" font-size="12" fill="#a8a29e" font-weight="400" text-anchor="start">完整度 5 / 22</text><rect x="876" y="574" width="268" height="46" rx="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="1010.0" y="603" font-family="Noto Sans CJK SC" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">手填尺码表看码</text><rect x="876" y="630" width="268" height="40" rx="11" fill="#fff" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 5"/><text x="1010.0" y="655" font-family="Noto Sans CJK SC" font-size="13" fill="#0f766e" font-weight="400" text-anchor="middle">再捏一下人台</text><text x="876" y="700" font-family="Noto Sans CJK SC" font-size="13" fill="#a8a29e" font-weight="600" text-anchor="start">最近推荐</text><rect x="876" y="710" width="268" height="50" rx="12" fill="#fff" stroke="none" stroke-width="0"/><text x="1010.0" y="740" font-family="Noto Sans CJK SC" font-size="13" fill="#a8a29e" font-weight="400" text-anchor="middle">还没有记录</text><line x1="866" y1="894" x2="1154" y2="894" stroke="#e7e5e4" stroke-width="1"/><text x="894.5" y="916" font-family="Noto Sans CJK SC" font-size="13" fill="#0f766e" font-weight="600" text-anchor="middle">首页</text><text x="971.5" y="916" font-family="Noto Sans CJK SC" font-size="13" fill="#a8a29e" font-weight="400" text-anchor="middle">试穿</text><text x="1048.5" y="916" font-family="Noto Sans CJK SC" font-size="13" fill="#a8a29e" font-weight="400" text-anchor="middle">档案</text><text x="1125.5" y="916" font-family="Noto Sans CJK SC" font-size="13" fill="#a8a29e" font-weight="400" text-anchor="middle">我的</text><text x="1010.0" y="1000" font-family="Noto Sans CJK SC" font-size="22" fill="#0f766e" font-weight="700" text-anchor="middle">③ 首页 · 人台变成你的</text><text x="1010.0" y="1026" font-family="Noto Sans CJK SC" font-size="15" fill="#b45309" font-weight="400" text-anchor="middle">仍是弱档，不谎称准</text><text x="1240" y="290" font-family="Noto Sans CJK SC" font-size="32" fill="#1c1917" font-weight="700" text-anchor="start">捏人可以，四条别破</text><circle cx="1255" cy="348" r="15" fill="#0f766e" stroke="none" stroke-width="0"/><text x="1255" y="354" font-family="Noto Sans CJK SC" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="1286" y="356" font-family="Noto Sans CJK SC" font-size="24" fill="#1c1917" font-weight="700" text-anchor="start">只给三个杆</text><text x="1286" y="388" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start">胖瘦、肚子、肩宽。给二十个杆，人不知道拖哪个，</text><text x="1286" y="414" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start">拖出来的数也和真身材无关。</text><line x1="1286" y1="436" x2="1860" y2="436" stroke="#e7e5e4" stroke-width="1"/><circle cx="1255" cy="466" r="15" fill="#0f766e" stroke="none" stroke-width="0"/><text x="1255" y="472" font-family="Noto Sans CJK SC" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="1286" y="474" font-family="Noto Sans CJK SC" font-size="24" fill="#1c1917" font-weight="700" text-anchor="start">不捏脸</text><text x="1286" y="506" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start">人台无头或抽象头。捏脸=人脸数据，合规等级直接跳级，</text><text x="1286" y="532" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start">产品也不需要。</text><line x1="1286" y1="554" x2="1860" y2="554" stroke="#e7e5e4" stroke-width="1"/><circle cx="1255" cy="584" r="15" fill="#0f766e" stroke="none" stroke-width="0"/><text x="1255" y="590" font-family="Noto Sans CJK SC" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="1286" y="592" font-family="Noto Sans CJK SC" font-size="24" fill="#1c1917" font-weight="700" text-anchor="start">捏得像 ≠ 量得准</text><text x="1286" y="624" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start">滑杆结果仍是弱档，首页照旧写「建议拍照」，</text><text x="1286" y="650" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start">置信度封顶。</text><line x1="1286" y1="672" x2="1860" y2="672" stroke="#e7e5e4" stroke-width="1"/><circle cx="1255" cy="702" r="15" fill="#0f766e" stroke="none" stroke-width="0"/><text x="1255" y="708" font-family="Noto Sans CJK SC" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="1286" y="710" font-family="Noto Sans CJK SC" font-size="24" fill="#1c1917" font-weight="700" text-anchor="start">先 2D，后 3D</text><text x="1286" y="742" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start">阶段 1 用能变形的剪影就够；可旋转的真 3D 排在阶段 4，</text><text x="1286" y="768" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start">别为了炫技提前。</text><rect x="1240" y="852" width="620" height="176" rx="18" fill="#fffdf8" stroke="#e7e5e4" stroke-width="2"/><text x="1264" y="890" font-family="Noto Sans CJK SC" font-size="22" fill="#1c1917" font-weight="700" text-anchor="start">同一具人台，三段长大</text><circle cx="1272" cy="927" r="6" fill="#a8a29e" stroke="none" stroke-width="0"/><text x="1290" y="932" font-family="Noto Sans CJK SC" font-size="17" fill="#a8a29e" font-weight="700" text-anchor="start">阶段 1</text><text x="1370" y="932" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">剪影 + 三个杆</text><circle cx="1272" cy="957" r="6" fill="#0f766e" stroke="none" stroke-width="0"/><text x="1290" y="962" font-family="Noto Sans CJK SC" font-size="17" fill="#0f766e" font-weight="700" text-anchor="start">阶段 2</text><text x="1370" y="962" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">拍照反解，自动变准</text><circle cx="1272" cy="987" r="6" fill="#78716c" stroke="none" stroke-width="0"/><text x="1290" y="992" font-family="Noto Sans CJK SC" font-size="17" fill="#78716c" font-weight="700" text-anchor="start">阶段 4</text><text x="1370" y="992" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">3D 可转 + 穿衣热力图</text><text x="1264" y="1062" font-family="Noto Sans CJK SC" font-size="19" fill="#0f766e" font-weight="600" text-anchor="start">三段用的是同一组参数，换的是「谁来定这组数」：先手拖，后照片。</text></svg>