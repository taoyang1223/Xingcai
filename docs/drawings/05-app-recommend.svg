<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#f6f1e8" stroke="none" stroke-width="0"/><text x="80" y="68" font-family="Noto Sans CJK SC" font-size="22" fill="#0f766e" font-weight="700" text-anchor="start">FITME · 图纸 5 / 6</text><text x="80" y="126" font-family="Noto Sans CJK SC" font-size="46" fill="#1c1917" font-weight="700" text-anchor="start">App 页面 · 推荐结果页为什么这样写</text><text x="80" y="176" font-family="Noto Sans CJK SC" font-size="24" fill="#57534e" font-weight="400" text-anchor="start">这页是整个产品的交付物。一个码不够，得让人知道差在哪、敢不敢买。</text><rect x="90" y="240" width="460" height="800" rx="34" fill="#1c1917" stroke="none" stroke-width="0"/><rect x="106" y="264" width="428" height="752" rx="20" fill="#f7f8f7" stroke="none" stroke-width="0"/><text x="136" y="322" font-family="Noto Sans CJK SC" font-size="20" fill="#57534e" font-weight="400" text-anchor="start">纯棉宽松长袖衬衫</text><text x="136" y="390" font-family="Noto Sans CJK SC" font-size="56" fill="#0f766e" font-weight="700" text-anchor="start">推荐 L</text><rect x="136" y="414" width="120" height="36" rx="18" fill="#ccfbf1" stroke="none" stroke-width="0"/><text x="196" y="439" font-family="Noto Sans CJK SC" font-size="16" fill="#0f766e" font-weight="600" text-anchor="middle">置信度 中</text><rect x="268" y="414" width="168" height="36" rx="18" fill="#fef3c7" stroke="none" stroke-width="0"/><text x="352" y="439" font-family="Noto Sans CJK SC" font-size="16" fill="#92400e" font-weight="600" text-anchor="middle">弱档 仅供参考</text><line x1="136" y1="478" x2="504" y2="478" stroke="#e7e5e4" stroke-width="1"/><circle cx="144" cy="514" r="7" fill="#0f766e"/><text x="166" y="520" font-family="Noto Sans CJK SC" font-size="19" fill="#1c1917" font-weight="400" text-anchor="start">胸围</text><text x="504" y="520" font-family="Noto Sans CJK SC" font-size="18" fill="#0f766e" font-weight="600" text-anchor="end">合适</text><circle cx="144" cy="560" r="7" fill="#b45309"/><text x="166" y="566" font-family="Noto Sans CJK SC" font-size="19" fill="#1c1917" font-weight="400" text-anchor="start">肩宽</text><text x="504" y="566" font-family="Noto Sans CJK SC" font-size="18" fill="#b45309" font-weight="600" text-anchor="end">偏紧 1.5</text><circle cx="144" cy="606" r="7" fill="#0f766e"/><text x="166" y="612" font-family="Noto Sans CJK SC" font-size="19" fill="#1c1917" font-weight="400" text-anchor="start">衣长</text><text x="504" y="612" font-family="Noto Sans CJK SC" font-size="18" fill="#0f766e" font-weight="600" text-anchor="end">合适</text><circle cx="144" cy="652" r="7" fill="#a8a29e"/><text x="166" y="658" font-family="Noto Sans CJK SC" font-size="19" fill="#1c1917" font-weight="400" text-anchor="start">袖长</text><text x="504" y="658" font-family="Noto Sans CJK SC" font-size="18" fill="#a8a29e" font-weight="600" text-anchor="end">未测 · 未参与</text><rect x="136" y="720" width="368" height="78" rx="14" fill="#f0fdfa" stroke="none" stroke-width="0"/><text x="154" y="752" font-family="Noto Sans CJK SC" font-size="17" fill="#115e59" font-weight="400" text-anchor="start">肩偏紧，介意可选 XL，</text><text x="154" y="780" font-family="Noto Sans CJK SC" font-size="17" fill="#115e59" font-weight="400" text-anchor="start">但衣长会过长。</text><rect x="136" y="816" width="368" height="50" rx="12" fill="#fff" stroke="#e7e5e4" stroke-width="2"/><text x="154" y="848" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="600" text-anchor="start">备选 XL</text><rect x="136" y="882" width="368" height="50" rx="12" fill="#fff" stroke="#fda4af" stroke-width="2" stroke-dasharray="6 5"/><text x="320.0" y="914" font-family="Noto Sans CJK SC" font-size="17" fill="#9f1239" font-weight="600" text-anchor="middle">没有合适的？想定制一件</text><text x="320.0" y="970" font-family="Noto Sans CJK SC" font-size="15" fill="#a8a29e" font-weight="400" text-anchor="middle">拍照建档后，置信度才会高</text><text x="640" y="300" font-family="Noto Sans CJK SC" font-size="30" fill="#1c1917" font-weight="700" text-anchor="start">六条规矩</text><circle cx="654" cy="352" r="14" fill="#0f766e"/><text x="654" y="358" font-family="Noto Sans CJK SC" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="684" y="360" font-family="Noto Sans CJK SC" font-size="24" fill="#1c1917" font-weight="700" text-anchor="start">码要大、要在第一屏</text><text x="684" y="396" font-family="Noto Sans CJK SC" font-size="19" fill="#57534e" font-weight="400" text-anchor="start">用户只想要一个答案。先给码，再给理由。</text><line x1="684" y1="422" x2="1848" y2="422" stroke="#e7e5e4" stroke-width="1"/><circle cx="654" cy="460" r="14" fill="#0f766e"/><text x="654" y="466" font-family="Noto Sans CJK SC" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="684" y="468" font-family="Noto Sans CJK SC" font-size="24" fill="#1c1917" font-weight="700" text-anchor="start">置信度不给假精度</text><text x="684" y="504" font-family="Noto Sans CJK SC" font-size="19" fill="#57534e" font-weight="400" text-anchor="start">只写高 / 中 / 低。弱档强制降级，并写「仅供参考」。</text><line x1="684" y1="530" x2="1848" y2="530" stroke="#e7e5e4" stroke-width="1"/><circle cx="654" cy="568" r="14" fill="#0f766e"/><text x="654" y="574" font-family="Noto Sans CJK SC" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="684" y="576" font-family="Noto Sans CJK SC" font-size="24" fill="#1c1917" font-weight="700" text-anchor="start">逐部位说人话</text><text x="684" y="612" font-family="Noto Sans CJK SC" font-size="19" fill="#57534e" font-weight="400" text-anchor="start">「偏紧 1.5」比「score 0.72」有用。颜色只做辅助。</text><line x1="684" y1="638" x2="1848" y2="638" stroke="#e7e5e4" stroke-width="1"/><circle cx="654" cy="676" r="14" fill="#0f766e"/><text x="654" y="682" font-family="Noto Sans CJK SC" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="684" y="684" font-family="Noto Sans CJK SC" font-size="24" fill="#1c1917" font-weight="700" text-anchor="start">没测的必须写出来</text><text x="684" y="720" font-family="Noto Sans CJK SC" font-size="19" fill="#57534e" font-weight="400" text-anchor="start">袖长未测就标「未参与」，不许悄悄按推算值算进去。</text><line x1="684" y1="746" x2="1848" y2="746" stroke="#e7e5e4" stroke-width="1"/><circle cx="654" cy="784" r="14" fill="#0f766e"/><text x="654" y="790" font-family="Noto Sans CJK SC" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="684" y="792" font-family="Noto Sans CJK SC" font-size="24" fill="#1c1917" font-weight="700" text-anchor="start">该劝退就劝退</text><text x="684" y="828" font-family="Noto Sans CJK SC" font-size="19" fill="#57534e" font-weight="400" text-anchor="start">肩宽、裤腰触发硬约束时，主结论可以直接是「不建议买」。</text><line x1="684" y1="854" x2="1848" y2="854" stroke="#e7e5e4" stroke-width="1"/><circle cx="654" cy="892" r="14" fill="#0f766e"/><text x="654" y="898" font-family="Noto Sans CJK SC" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="684" y="900" font-family="Noto Sans CJK SC" font-size="24" fill="#1c1917" font-weight="700" text-anchor="start">定制按钮只埋点</text><text x="684" y="936" font-family="Noto Sans CJK SC" font-size="19" fill="#57534e" font-weight="400" text-anchor="start">统计有多少人点，够多再考虑做定制。这一刀不做履约。</text></svg>