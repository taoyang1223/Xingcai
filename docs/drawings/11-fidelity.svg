</defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#f6f1e8" stroke="none" stroke-width="0" opacity="1.0"/><text x="80" y="60" font-family="Noto Sans CJK SC" font-size="22" fill="#0f766e" font-weight="700" text-anchor="start" opacity="1.0">FITME · 图纸 11</text><text x="80" y="116" font-family="Noto Sans CJK SC" font-size="44" fill="#1c1917" font-weight="700" text-anchor="start" opacity="1.0">App 页面 · 精致到哪一档才有用</text><text x="80" y="162" font-family="Noto Sans CJK SC" font-size="23" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">同一具人台，三种精致度。差别来自资产、光照和后处理——引擎只决定天花板，不决定这三档。</text><rect x="80" y="196" width="560" height="428" rx="20" fill="url(#bgA)" stroke="#a8a29e" stroke-width="2" opacity="1.0"/><ellipse cx="360.0" cy="581.36" rx="85.19999999999999" ry="17.04" fill="#1f2a26" opacity="0.28" filter="url(#soft)"/><ellipse cx="360.0" cy="314.4" rx="22.72" ry="29.82" fill="url(#flat)" opacity="1.0"/><rect x="351.48" y="337.12" width="17.04" height="22.72" rx="7.1" fill="url(#flat)" stroke="none" stroke-width="0" opacity="1.0"/><rect x="314.56" y="357.0" width="90.88" height="17.04" rx="8.52" fill="url(#flat)" stroke="none" stroke-width="0" opacity="1.0"/><path d="M 321.66 364.1 C 311.72 419.48, 317.4 442.2, 328.76 467.76 L 391.24 467.76 C 402.6 442.2, 408.28 419.48, 398.34 364.1 Z" fill="url(#flat)" stroke="none" stroke-width="0" opacity="1.0"/><rect x="307.46" y="365.52" width="17.04" height="88.03999999999999" rx="8.52" fill="url(#flat)" stroke="none" stroke-width="0" opacity="1.0"/><rect x="395.5" y="365.52" width="17.04" height="88.03999999999999" rx="8.52" fill="url(#flat)" stroke="none" stroke-width="0" opacity="1.0"/><rect x="330.18" y="464.92" width="25.56" height="105.08" rx="11.36" fill="url(#flat)" stroke="none" stroke-width="0" opacity="1.0"/><rect x="364.26" y="464.92" width="25.56" height="105.08" rx="11.36" fill="url(#flat)" stroke="none" stroke-width="0" opacity="1.0"/><text x="106" y="240" font-family="Noto Sans CJK SC" font-size="26" fill="#1c1917" font-weight="700" text-anchor="start" opacity="1.0">A  扁平风格化</text><rect x="543" y="216" width="71" height="30" rx="15" fill="#a8a29e" stroke="none" stroke-width="0" opacity="1.0"/><text x="578.5" y="237" font-family="Noto Sans CJK SC" font-size="15" fill="#fff" font-weight="600" text-anchor="middle" opacity="1.0">不推荐</text><text x="106" y="662" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">一个颜色铺满，只有一层接触阴影。</text><text x="106" y="691" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">做起来最快，但看着像占位图，</text><text x="106" y="720" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">用户不会觉得「这是我的身材」。</text><rect x="680" y="196" width="560" height="428" rx="20" fill="url(#bgB)" stroke="#0f766e" stroke-width="3" opacity="1.0"/><ellipse cx="960.0" cy="581.36" rx="85.19999999999999" ry="17.04" fill="#1f2a26" opacity="0.28" filter="url(#soft)"/><ellipse cx="960.0" cy="578.52" rx="48.28" ry="9.94" fill="#1f2a26" opacity="0.35" filter="url(#soft2)"/><ellipse cx="960.0" cy="314.4" rx="22.72" ry="29.82" fill="url(#pbr)" opacity="1.0"/><rect x="951.48" y="337.12" width="17.04" height="22.72" rx="7.1" fill="url(#pbr)" stroke="none" stroke-width="0" opacity="1.0"/><rect x="914.56" y="357.0" width="90.88" height="17.04" rx="8.52" fill="url(#pbr)" stroke="none" stroke-width="0" opacity="1.0"/><path d="M 921.66 364.1 C 911.72 419.48, 917.4 442.2, 928.76 467.76 L 991.24 467.76 C 1002.6 442.2, 1008.28 419.48, 998.34 364.1 Z" fill="url(#pbr)" stroke="none" stroke-width="0" opacity="1.0"/><rect x="907.46" y="365.52" width="17.04" height="88.03999999999999" rx="8.52" fill="url(#pbr)" stroke="none" stroke-width="0" opacity="1.0"/><rect x="995.5" y="365.52" width="17.04" height="88.03999999999999" rx="8.52" fill="url(#pbr)" stroke="none" stroke-width="0" opacity="1.0"/><rect x="930.18" y="464.92" width="25.56" height="105.08" rx="11.36" fill="url(#pbr)" stroke="none" stroke-width="0" opacity="1.0"/><rect x="964.26" y="464.92" width="25.56" height="105.08" rx="11.36" fill="url(#pbr)" stroke="none" stroke-width="0" opacity="1.0"/><ellipse cx="947.22" cy="391.08" rx="21.299999999999997" ry="36.92" fill="url(#spec)" opacity="0.85"/><ellipse cx="954.32" cy="317.24" rx="12.78" ry="15.62" fill="url(#spec)" opacity="0.7"/><path d="M 921.66 364.1 C 911.72 419.48, 917.4 442.2, 928.76 467.76 L 991.24 467.76 C 1002.6 442.2, 1008.28 419.48, 998.34 364.1 Z" fill="url(#rim)" stroke="none" stroke-width="0" opacity="0.9"/><text x="706" y="240" font-family="Noto Sans CJK SC" font-size="26" fill="#1c1917" font-weight="700" text-anchor="start" opacity="1.0">B  PBR 磨砂人台</text><rect x="1158" y="216" width="56" height="30" rx="15" fill="#0f766e" stroke="none" stroke-width="0" opacity="1.0"/><text x="1186.0" y="237" font-family="Noto Sans CJK SC" font-size="15" fill="#fff" font-weight="600" text-anchor="middle" opacity="1.0">推荐</text><text x="706" y="662" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">金属度低、粗糙度高的磨砂材质，加一张 HDRI 环境贴图、</text><text x="706" y="691" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">边缘光和柔和接触影。看起来像橱窗里的高级人台，</text><text x="706" y="720" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">three.js 就能做，手机也跑得动。</text><rect x="1280" y="196" width="560" height="428" rx="20" fill="url(#bgC)" stroke="#b45309" stroke-width="2" opacity="1.0"/><ellipse cx="1560.0" cy="581.36" rx="85.19999999999999" ry="17.04" fill="#000000" opacity="0.55" filter="url(#soft)"/><ellipse cx="1560.0" cy="578.52" rx="48.28" ry="9.94" fill="#000000" opacity="0.35" filter="url(#soft2)"/><ellipse cx="1560.0" cy="314.4" rx="22.72" ry="29.82" fill="url(#hifi)" opacity="1.0"/><rect x="1551.48" y="337.12" width="17.04" height="22.72" rx="7.1" fill="url(#hifi)" stroke="none" stroke-width="0" opacity="1.0"/><rect x="1514.56" y="357.0" width="90.88" height="17.04" rx="8.52" fill="url(#hifi)" stroke="none" stroke-width="0" opacity="1.0"/><path d="M 1521.66 364.1 C 1511.72 419.48, 1517.4 442.2, 1528.76 467.76 L 1591.24 467.76 C 1602.6 442.2, 1608.28 419.48, 1598.34 364.1 Z" fill="url(#hifi)" stroke="none" stroke-width="0" opacity="1.0"/><rect x="1507.46" y="365.52" width="17.04" height="88.03999999999999" rx="8.52" fill="url(#hifi)" stroke="none" stroke-width="0" opacity="1.0"/><rect x="1595.5" y="365.52" width="17.04" height="88.03999999999999" rx="8.52" fill="url(#hifi)" stroke="none" stroke-width="0" opacity="1.0"/><rect x="1530.18" y="464.92" width="25.56" height="105.08" rx="11.36" fill="url(#hifi)" stroke="none" stroke-width="0" opacity="1.0"/><rect x="1564.26" y="464.92" width="25.56" height="105.08" rx="11.36" fill="url(#hifi)" stroke="none" stroke-width="0" opacity="1.0"/><ellipse cx="1547.22" cy="391.08" rx="21.299999999999997" ry="36.92" fill="url(#spec)" opacity="0.85"/><ellipse cx="1554.32" cy="317.24" rx="12.78" ry="15.62" fill="url(#spec)" opacity="0.7"/><path d="M 1521.66 364.1 C 1511.72 419.48, 1517.4 442.2, 1528.76 467.76 L 1591.24 467.76 C 1602.6 442.2, 1608.28 419.48, 1598.34 364.1 Z" fill="url(#rim)" stroke="none" stroke-width="0" opacity="0.9"/><path d="M 1535.86 374.04 Q 1560.0 382.56, 1584.14 374.04" fill="none" stroke="#ffffff" stroke-width="1.9879999999999998" opacity="0.3"/><path d="M 1560.0 405.28 L 1560.0 450.72" fill="none" stroke="#3d342b" stroke-width="1.704" opacity="0.28"/><path d="M 1541.54 425.16 Q 1560.0 430.84, 1578.46 425.16" fill="none" stroke="#3d342b" stroke-width="1.562" opacity="0.22"/><ellipse cx="1561.42" cy="595.56" rx="36.92" ry="28.4" fill="url(#hifi)" opacity="0.13"/><ellipse cx="1531.6" cy="385.4" rx="7.1" ry="28.4" fill="#ffffff" opacity="0.18"/><text x="1306" y="240" font-family="Noto Sans CJK SC" font-size="26" fill="#f5f5f4" font-weight="700" text-anchor="start" opacity="1.0">C  高保真写实</text><rect x="1683" y="216" width="131" height="30" rx="15" fill="#b45309" stroke="none" stroke-width="0" opacity="1.0"/><text x="1748.5" y="237" font-family="Noto Sans CJK SC" font-size="15" fill="#fff" font-weight="600" text-anchor="middle" opacity="1.0">阶段 4 再说</text><text x="1306" y="662" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">皮肤次表面散射、肌肉起伏、环境反射、布料。</text><text x="1306" y="691" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">这一档才真需要 UE 或 Unity 的材质与后处理栈，</text><text x="1306" y="720" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">而且手机端基本得靠服务端渲染推流。</text><text x="80" y="782" font-family="Noto Sans CJK SC" font-size="30" fill="#1c1917" font-weight="700" text-anchor="start" opacity="1.0">拿什么换什么</text><line x1="80" y1="800" x2="1840" y2="800" stroke="#e7e5e4" stroke-width="2" opacity="1.0"/><text x="80" y="828" font-family="Noto Sans CJK SC" font-size="18" fill="#a8a29e" font-weight="700" text-anchor="start" opacity="1.0"></text><text x="460" y="828" font-family="Noto Sans CJK SC" font-size="18" fill="#a8a29e" font-weight="700" text-anchor="start" opacity="1.0">能做到的上限</text><text x="700" y="828" font-family="Noto Sans CJK SC" font-size="18" fill="#a8a29e" font-weight="700" text-anchor="start" opacity="1.0">装进手机的代价</text><text x="1000" y="828" font-family="Noto Sans CJK SC" font-size="18" fill="#a8a29e" font-weight="700" text-anchor="start" opacity="1.0">滑杆实时变形</text><text x="1290" y="828" font-family="Noto Sans CJK SC" font-size="18" fill="#a8a29e" font-weight="700" text-anchor="start" opacity="1.0">这一档的瓶颈</text><line x1="80" y1="880" x2="1840" y2="880" stroke="#e7e5e4" stroke-width="1" opacity="1.0"/><text x="80" y="866" font-family="Noto Sans CJK SC" font-size="20" fill="#0f766e" font-weight="700" text-anchor="start" opacity="1.0">three.js</text><text x="460" y="866" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">B 档，逼近 C 档下沿</text><text x="700" y="866" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">几兆，网页直接开</text><text x="1000" y="866" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">顺，改参数立刻变形</text><text x="1290" y="866" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">资产和光照，不是引擎</text><line x1="80" y1="924" x2="1840" y2="924" stroke="#e7e5e4" stroke-width="1" opacity="1.0"/><text x="80" y="910" font-family="Noto Sans CJK SC" font-size="20" fill="#57534e" font-weight="700" text-anchor="start" opacity="1.0">Unity</text><text x="460" y="910" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">C 档</text><text x="700" y="910" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">原生包 +30～50 MB；WebGL 更重</text><text x="1000" y="910" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">顺</text><text x="1290" y="910" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">包体、启动、发热</text><line x1="80" y1="968" x2="1840" y2="968" stroke="#e7e5e4" stroke-width="1" opacity="1.0"/><text x="80" y="954" font-family="Noto Sans CJK SC" font-size="20" fill="#57534e" font-weight="700" text-anchor="start" opacity="1.0">Unreal</text><text x="460" y="954" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">C 档以上</text><text x="700" y="954" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">手机基本得服务端渲染推流</text><text x="1000" y="954" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">顺，但每人一路 GPU</text><text x="1290" y="954" font-family="Noto Sans CJK SC" font-size="18" fill="#57534e" font-weight="400" text-anchor="start" opacity="1.0">服务器成本，按分钟烧钱</text><rect x="80" y="998" width="1760" height="74" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="3" opacity="1.0"/><text x="110" y="1032" font-family="Noto Sans CJK SC" font-size="24" fill="#115e59" font-weight="700" text-anchor="start" opacity="1.0">选 B 档还有个非技术理由：越写实，用户越盯着脸和皮肤看——而我们恰恰不能做脸。</text><text x="110" y="1060" font-family="Noto Sans CJK SC" font-size="21" fill="#115e59" font-weight="400" text-anchor="start" opacity="1.0">磨砂无头人台既躲开恐怖谷，也把注意力逼回体型本身，这正是我们要他确认的东西。</text></svg>