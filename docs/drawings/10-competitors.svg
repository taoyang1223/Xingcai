<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#f6f1e8" stroke="none" stroke-width="0" opacity="1.0"/><text x="80" y="62" font-family="Noto Sans CJK SC" font-size="22" fill="#0f766e" font-weight="700" text-anchor="start">FITME · 图纸 10</text><text x="80" y="118" font-family="Noto Sans CJK SC" font-size="44" fill="#1c1917" font-weight="700" text-anchor="start">App 页面 · 别人是怎么做的（2026 年查证）</text><text x="80" y="164" font-family="Noto Sans CJK SC" font-size="23" fill="#57534e" font-weight="400" text-anchor="start">你记得的「游戏引擎」是真的，但它在 B 端打版那一侧；C 端手机上，没人把 UE 搬进去。</text><rect x="80" y="200" width="570" height="420" rx="18" fill="#fffdf8" stroke="#0f766e" stroke-width="3" opacity="1.0"/><text x="106" y="248" font-family="Noto Sans CJK SC" font-size="28" fill="#1c1917" font-weight="700" text-anchor="start">Zalando</text><rect x="495" y="224" width="129" height="30" rx="15" fill="#0f766e" stroke="none" stroke-width="0" opacity="1.0"/><text x="559.5" y="245" font-family="Noto Sans CJK SC" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">和我们目标最像</text><line x1="106" y1="266" x2="624" y2="266" stroke="#e7e5e4" stroke-width="1"/><text x="106" y="300" font-family="Noto Sans CJK SC" font-size="16" fill="#0f766e" font-weight="700" text-anchor="start">做什么</text><text x="190" y="300" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">两张照片或一段视频 → 身体测量 → 3D avatar → 虚拟试衣间，</text><text x="190" y="330" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">同时给尺码推荐。360° 可转、可放大。</text><text x="106" y="360" font-family="Noto Sans CJK SC" font-size="16" fill="#0f766e" font-weight="700" text-anchor="start">用什么</text><text x="190" y="360" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">自研，Web / App 技术栈。不是游戏引擎。</text><text x="106" y="390" font-family="Noto Sans CJK SC" font-size="16" fill="#0f766e" font-weight="700" text-anchor="start">走过的路</text><text x="190" y="390" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">2018 年起步，80 人团队。早期 avatar 就是拿身高、体重、</text><text x="190" y="420" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">性别做统计建模——和我们的「弱档」一模一样。2023 年才上</text><text x="190" y="450" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">照片测量，2024 年才把测量接进试衣间。</text><text x="106" y="480" font-family="Noto Sans CJK SC" font-size="16" fill="#0f766e" font-weight="700" text-anchor="start">对我们</text><text x="190" y="480" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">我们的分期不是拍脑袋，是别人走过一遍的顺序。</text><rect x="675" y="200" width="570" height="420" rx="18" fill="#fffdf8" stroke="#a8a29e" stroke-width="2" opacity="1.0"/><text x="701" y="248" font-family="Noto Sans CJK SC" font-size="28" fill="#1c1917" font-weight="700" text-anchor="start">Walmart · Zeekit</text><rect x="1090" y="224" width="129" height="30" rx="15" fill="#a8a29e" stroke="none" stroke-width="0" opacity="1.0"/><text x="1154.5" y="245" font-family="Noto Sans CJK SC" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">干脆不做 3D</text><line x1="701" y1="266" x2="1219" y2="266" stroke="#e7e5e4" stroke-width="1"/><text x="701" y="300" font-family="Noto Sans CJK SC" font-size="16" fill="#57534e" font-weight="700" text-anchor="start">做什么</text><text x="785" y="300" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">「选个像我的模特」：五十个不同身高体型的真人模特，</text><text x="785" y="330" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">挑一个最接近自己的看效果。后来加了上传自己照片。</text><text x="701" y="360" font-family="Noto Sans CJK SC" font-size="16" fill="#57534e" font-weight="700" text-anchor="start">用什么</text><text x="785" y="360" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">实时图像处理：把人和衣服都切成上千片再对应映射。</text><text x="785" y="390" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">是 2D 图像变形，不是 3D 网格，也没有布料仿真。</text><text x="701" y="420" font-family="Noto Sans CJK SC" font-size="16" fill="#57534e" font-weight="700" text-anchor="start">结果</text><text x="785" y="420" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">解决「好不好看」，不解决「该穿哪个码」。</text><text x="701" y="450" font-family="Noto Sans CJK SC" font-size="16" fill="#57534e" font-weight="700" text-anchor="start">对我们</text><text x="785" y="450" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">看得见 ≠ 穿得对。视觉和选码是两件事，别混为一谈。</text><rect x="1270" y="200" width="570" height="420" rx="18" fill="#fffdf8" stroke="#b45309" stroke-width="2" opacity="1.0"/><text x="1296" y="248" font-family="Noto Sans CJK SC" font-size="28" fill="#1c1917" font-weight="700" text-anchor="start">Style3D / CLO</text><rect x="1670" y="224" width="144" height="30" rx="15" fill="#b45309" stroke="none" stroke-width="0" opacity="1.0"/><text x="1742.0" y="245" font-family="Noto Sans CJK SC" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">你记得的引擎在这</text><line x1="1296" y1="266" x2="1814" y2="266" stroke="#e7e5e4" stroke-width="1"/><text x="1296" y="300" font-family="Noto Sans CJK SC" font-size="16" fill="#b45309" font-weight="700" text-anchor="start">做什么</text><text x="1380" y="300" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">服装打版、布料仿真、走秀视效、数字人换装。</text><text x="1296" y="330" font-family="Noto Sans CJK SC" font-size="16" fill="#b45309" font-weight="700" text-anchor="start">用什么</text><text x="1380" y="330" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">确实是虚幻引擎——Style3D 的 Simulator 是 UE 插件，</text><text x="1380" y="360" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">底层自研 GPU 柔性体仿真，基于 CUDA。</text><text x="1296" y="390" font-family="Noto Sans CJK SC" font-size="16" fill="#b45309" font-weight="700" text-anchor="start">跑在哪</text><text x="1380" y="390" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">要 NVIDIA 显卡 + Windows。这是工作站/服务端方案，</text><text x="1380" y="420" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">不是消费者手机上跑的东西。</text><text x="1296" y="450" font-family="Noto Sans CJK SC" font-size="16" fill="#b45309" font-weight="700" text-anchor="start">对我们</text><text x="1380" y="450" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">引擎属于 B 端打版和渲染。真要做布料模拟是阶段 4，</text><text x="1380" y="480" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">而且大概率是接 SDK 或服务端算，不是塞进 App。</text><text x="80" y="644" font-family="Noto Sans CJK SC" font-size="30" fill="#1c1917" font-weight="700" text-anchor="start">一个必须认真对待的数字</text><text x="80" y="680" font-family="Noto Sans CJK SC" font-size="21" fill="#57534e" font-weight="400" text-anchor="start">同一家公司（Zalando），两种做法，效果差得远——但方向和你想的可能相反。</text><text x="80" y="734" font-family="Noto Sans CJK SC" font-size="21" fill="#1c1917" font-weight="700" text-anchor="start">纯尺码推荐，没有 3D</text><rect x="430" y="712" width="550.0" height="34" rx="8" fill="#0f766e" stroke="none" stroke-width="0" opacity="1.0"/><text x="996.0" y="737" font-family="Noto Sans CJK SC" font-size="22" fill="#0f766e" font-weight="700" text-anchor="start">3.8% ~ 6.6%</text><text x="430" y="770" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">七十二万人一组的严格 A/B 测试，同行评议论文（KDD 2021）。鞋 3.8%，纺织品 4.3% 和 6.6%。</text><text x="80" y="820" font-family="Noto Sans CJK SC" font-size="21" fill="#1c1917" font-weight="700" text-anchor="start">3D 虚拟试衣间</text><rect x="430" y="798" width="1000.0" height="34" rx="8" fill="#d6d3d1" stroke="none" stroke-width="0" opacity="1.0"/><text x="1446.0" y="823" font-family="Noto Sans CJK SC" font-size="22" fill="#57534e" font-weight="700" text-anchor="start">宣称 40%</text><text x="430" y="856" font-family="Noto Sans CJK SC" font-size="17" fill="#57534e" font-weight="400" text-anchor="start">小范围试点的自报数字，没有对照组，公司自己也说「受测试阶段限制」。</text><rect x="80" y="880" width="1760" height="84" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="3" opacity="1.0"/><text x="110" y="918" font-family="Noto Sans CJK SC" font-size="26" fill="#115e59" font-weight="700" text-anchor="start">结论：3D 是「让人相信这是我」的界面，把退货率打下来的是推荐算法和尺码表。</text><text x="110" y="950" font-family="Noto Sans CJK SC" font-size="22" fill="#115e59" font-weight="400" text-anchor="start">所以 3D 照做——但它不许挤占推荐引擎的工期，更不能为了 3D 把阶段 1 拖成半年。</text><rect x="80" y="984" width="1760" height="72" rx="16" fill="#fffdf8" stroke="#e7e5e4" stroke-width="2" opacity="1.0"/><text x="110" y="1014" font-family="Noto Sans CJK SC" font-size="20" fill="#0f766e" font-weight="700" text-anchor="start">我们的选择</text><text x="230" y="1014" font-family="Noto Sans CJK SC" font-size="20" fill="#57534e" font-weight="400" text-anchor="start">阶段 1：three.js + 低模 GLB，几兆，能转能捏，够用。</text><text x="110" y="1044" font-family="Noto Sans CJK SC" font-size="20" fill="#b45309" font-weight="700" text-anchor="start">阶段 4</text><text x="230" y="1044" font-family="Noto Sans CJK SC" font-size="20" fill="#57534e" font-weight="400" text-anchor="start">真要布料模拟再谈引擎，且优先接 SDK 或服务端渲染——不把 UE 塞进手机 App。</text></svg>