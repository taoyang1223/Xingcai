<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#f6f1e8"/>
  <text x="80" y="70" font-family="Noto Sans CJK SC" font-size="22" fill="#0f766e" font-weight="700">FITME · 图纸 3 / 3</text>
  <text x="80" y="128" font-family="Noto Sans CJK SC" font-size="44" fill="#1c1917" font-weight="700">分期，以及下一刀只切什么</text>
  <text x="80" y="178" font-family="Noto Sans CJK SC" font-size="24" fill="#57534e">上一阶段没做成，不准开下一阶段。现在停在看图；下一刀是选码内核。</text>
  <g font-family="Noto Sans CJK SC">
    <rect x="72" y="220" width="344" height="250" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
    <rect x="92" y="240" width="72" height="28" rx="6" fill="#f59e0b"/>
    <text x="128" y="260" text-anchor="middle" font-size="14" font-weight="700">现在</text>
    <text x="92" y="310" font-size="26" font-weight="700">0  看懂图</text>
    <text x="92" y="354" font-size="18" fill="#57534e">需求口径对齐</text>
    <text x="92" y="388" font-size="18" fill="#57534e">不写功能代码</text>
    <text x="92" y="422" font-size="18" fill="#57534e">你正在看的就是这张</text>

    <rect x="436" y="220" width="344" height="250" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
    <rect x="456" y="240" width="88" height="28" rx="6" fill="#ccfbf1"/>
    <text x="500" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">下一刀</text>
    <text x="456" y="310" font-size="26" font-weight="700">1  选码内核</text>
    <text x="456" y="354" font-size="18" fill="#57534e">弱档 + 手填尺码表</text>
    <text x="456" y="388" font-size="18" fill="#57534e">规则算出推荐码</text>
    <text x="456" y="422" font-size="18" fill="#57534e">写身体数据先同意</text>

    <rect x="800" y="220" width="344" height="250" rx="18" fill="#fffdf8" stroke="#d6d3d1" stroke-width="2"/>
    <rect x="820" y="240" width="72" height="28" rx="6" fill="#e7e5e4"/>
    <text x="856" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#57534e">其后</text>
    <text x="820" y="310" font-size="26" font-weight="700">2  拍照建档</text>
    <text x="820" y="354" font-size="18" fill="#57534e">靠墙倒计时正侧</text>
    <text x="820" y="388" font-size="18" fill="#57534e">自有人台反解</text>
    <text x="820" y="422" font-size="18" fill="#57534e">原图不进业务库</text>

    <rect x="1164" y="220" width="344" height="250" rx="18" fill="#fffdf8" stroke="#d6d3d1" stroke-width="2"/>
    <rect x="1184" y="240" width="72" height="28" rx="6" fill="#e7e5e4"/>
    <text x="1220" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#57534e">其后</text>
    <text x="1184" y="310" font-size="26" font-weight="700">3  商品进来</text>
    <text x="1184" y="354" font-size="18" fill="#57534e">尺码表截图识别</text>
    <text x="1184" y="388" font-size="18" fill="#57534e">人工纠错</text>
    <text x="1184" y="422" font-size="18" fill="#57534e">链接怎么进仍未定</text>

    <rect x="1528" y="220" width="320" height="250" rx="18" fill="#fffdf8" stroke="#d6d3d1" stroke-width="2"/>
    <rect x="1548" y="240" width="72" height="28" rx="6" fill="#e7e5e4"/>
    <text x="1584" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#57534e">内测</text>
    <text x="1548" y="310" font-size="24" font-weight="700">4  敢按推荐买</text>
    <text x="1548" y="354" font-size="18" fill="#57534e">松紧热力图</text>
    <text x="1548" y="388" font-size="18" fill="#57534e">简 3D、穿着反馈</text>
    <text x="1548" y="422" font-size="18" fill="#57534e">正式 App 壳</text>

    <rect x="72" y="520" width="872" height="480" rx="24" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
    <text x="108" y="584" font-size="34" font-weight="700" fill="#115e59">下一刀做</text>
    <text x="108" y="650" font-size="24" fill="#115e59">1. 弱档：身高体重 + 体型模板</text>
    <text x="108" y="706" font-size="24" fill="#115e59">2. 手填一张尺码表</text>
    <text x="108" y="762" font-size="24" fill="#115e59">3. 给出推荐码和部位说明</text>
    <text x="108" y="818" font-size="24" fill="#115e59">4. 写身体数据必须先单独同意</text>
    <text x="108" y="874" font-size="24" fill="#115e59">5. T恤 / 衬衫 / 裤装的松量能改</text>
    <text x="108" y="940" font-size="20" fill="#0f766e">做成的样子：假数据改松量，推荐码跟着变</text>

    <rect x="976" y="520" width="872" height="480" rx="24" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
    <text x="1012" y="584" font-size="34" font-weight="700" fill="#9f1239">下一刀不做</text>
    <text x="1012" y="650" font-size="24" fill="#9f1239">1. 拍照页、相机、3D 试穿</text>
    <text x="1012" y="706" font-size="24" fill="#9f1239">2. 粘贴淘宝链接真解析</text>
    <text x="1012" y="762" font-size="24" fill="#9f1239">3. 接量体厂商 SDK</text>
    <text x="1012" y="818" font-size="24" fill="#9f1239">4. 支付、定制、打版</text>
    <text x="1012" y="874" font-size="24" fill="#9f1239">5. 让用户填 22 个厘米数</text>
    <text x="1012" y="940" font-size="20" fill="#be123c">这些不是不重要，是现在做了也验收不了选码</text>
  </g>
</svg>
