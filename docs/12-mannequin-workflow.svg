<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#f6f1e8"/>
  <text x="80" y="52" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" fill="#0f766e" font-weight="700">FITME · 图纸 12</text>
  <text x="80" y="102" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="42" fill="#1c1917" font-weight="700">精致人台怎么来：工厂做一次，App 用一万次</text>
  <text x="80" y="144" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="22" fill="#57534e">Maya / AI 只在离线工厂里干活。用户手机从不调用建模软件，也不把原图喂给大模型雕一具新模。</text>

  <rect x="64" y="172" width="1792" height="268" rx="22" fill="#fffdf8" stroke="#0f766e" stroke-width="3"/>
  <rect x="88" y="156" width="168" height="34" rx="17" fill="#0f766e"/>
  <text x="172" y="179" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#fff">离线 · 工厂</text>
  <text x="272" y="178" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="16" fill="#0f766e" font-weight="600">做一具好看的无头人台，全用户共用</text>

  <g font-family="Noto Sans CJK SC, PingFang SC, sans-serif">
    <rect x="96" y="210" width="280" height="200" rx="16" fill="#f0fdfa" stroke="#1c1917" stroke-width="2.5"/>
    <text x="116" y="250" font-size="22" font-weight="700" fill="#1c1917">1  美术 / AI</text>
    <text x="116" y="286" font-size="16" fill="#57534e">Maya 或 Blender 雕模</text>
    <text x="116" y="314" font-size="16" fill="#57534e">AI 可辅助出草稿</text>
    <text x="116" y="342" font-size="16" fill="#57534e">磨砂无头 · 不做脸</text>
    <text x="116" y="380" font-size="15" fill="#0f766e" font-weight="700">一次，不是每人一次</text>

    <rect x="416" y="210" width="280" height="200" rx="16" fill="#fffdf8" stroke="#1c1917" stroke-width="2.5"/>
    <text x="436" y="250" font-size="22" font-weight="700" fill="#1c1917">2  三个形态</text>
    <text x="436" y="286" font-size="16" fill="#57534e">BS_Fat  整体胖瘦</text>
    <text x="436" y="314" font-size="16" fill="#57534e">BS_Belly  肚子（侧面）</text>
    <text x="436" y="342" font-size="16" fill="#57534e">BS_Shoulder  肩宽</text>
    <text x="436" y="380" font-size="15" fill="#0f766e" font-weight="700">名字写进合同，不许乱改</text>

    <rect x="736" y="210" width="280" height="200" rx="16" fill="#fffdf8" stroke="#1c1917" stroke-width="2.5"/>
    <text x="756" y="250" font-size="22" font-weight="700" fill="#1c1917">3  导出 GLB</text>
    <text x="756" y="286" font-size="16" fill="#57534e">glTF 二进制 · 不超过 5k 面</text>
    <text x="756" y="314" font-size="16" fill="#57534e">Draco 压缩 · 目标不超过 2MB</text>
    <text x="756" y="342" font-size="16" fill="#57534e">附一份 manifest.json</text>
    <text x="756" y="380" font-size="15" fill="#0f766e" font-weight="700">App 只认这个文件</text>

    <rect x="1056" y="210" width="280" height="200" rx="16" fill="#fffdf8" stroke="#1c1917" stroke-width="2.5"/>
    <text x="1076" y="250" font-size="22" font-weight="700" fill="#1c1917">4  挂上 CDN</text>
    <text x="1076" y="286" font-size="16" fill="#57534e">进捏人页才下载</text>
    <text x="1076" y="314" font-size="16" fill="#57534e">首屏不背模型</text>
    <text x="1076" y="342" font-size="16" fill="#57534e">Web / 以后 Flutter 共用</text>
    <text x="1076" y="380" font-size="15" fill="#0f766e" font-weight="700">两端禁止各做一套网格</text>

    <rect x="1376" y="210" width="448" height="200" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
    <text x="1396" y="250" font-size="22" font-weight="700" fill="#115e59">交付物就这些</text>
    <text x="1396" y="290" font-size="17" fill="#115e59">mannequin_headless_v1.glb</text>
    <text x="1396" y="322" font-size="17" fill="#115e59">BS_Fat / Belly / Shoulder</text>
    <text x="1396" y="354" font-size="17" fill="#115e59">授权文件进 docs/licenses/</text>
    <text x="1396" y="386" font-size="15" fill="#0f766e" font-weight="700">精致感来自这里，不是来自引擎</text>
  </g>
  <g fill="#0f766e" font-size="36" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" text-anchor="middle">
    <text x="392" y="322">→</text>
    <text x="712" y="322">→</text>
    <text x="1032" y="322">→</text>
    <text x="1352" y="322">→</text>
  </g>

  <rect x="64" y="464" width="1792" height="268" rx="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
  <rect x="88" y="448" width="168" height="34" rx="17" fill="#f59e0b"/>
  <text x="172" y="471" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#111">在线 · 每个用户</text>
  <text x="272" y="470" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="16" fill="#b45309" font-weight="600">只写一组参数 β，立刻驱动同一具人台</text>

  <g font-family="Noto Sans CJK SC, PingFang SC, sans-serif">
    <rect x="96" y="502" width="250" height="200" rx="16" fill="#fffdf8" stroke="#1c1917" stroke-width="2.5"/>
    <text x="116" y="542" font-size="21" font-weight="700" fill="#1c1917">1  手机建档</text>
    <text x="116" y="578" font-size="15" fill="#57534e">阶段 1：拖三根杆</text>
    <text x="116" y="606" font-size="15" fill="#57534e">阶段 2：正侧两张 + 身高</text>
    <text x="116" y="634" font-size="15" fill="#57534e">贴身衣 · 靠墙 · 倒计时</text>
    <text x="116" y="672" font-size="14" fill="#b45309" font-weight="700">不填 22 个厘米</text>

    <rect x="386" y="502" width="250" height="200" rx="16" fill="#fffdf8" stroke="#1c1917" stroke-width="2.5"/>
    <text x="406" y="542" font-size="21" font-weight="700" fill="#1c1917">2  端侧先拦</text>
    <text x="406" y="578" font-size="15" fill="#57534e">废片 / 裸露 / 卫衣拦截</text>
    <text x="406" y="606" font-size="15" fill="#57534e">糊脸之后才考虑上传</text>
    <text x="406" y="634" font-size="15" fill="#57534e">须有 consent_id</text>
    <text x="406" y="672" font-size="14" fill="#b45309" font-weight="700">原图不进业务库</text>

    <rect x="676" y="502" width="250" height="200" rx="16" fill="#fffdf8" stroke="#1c1917" stroke-width="2.5"/>
    <text x="696" y="542" font-size="21" font-weight="700" fill="#1c1917">3  反解 β</text>
    <text x="696" y="578" font-size="15" fill="#57534e">height / fat / belly</text>
    <text x="696" y="606" font-size="15" fill="#57534e">shoulder · 同一套字段</text>
    <text x="696" y="634" font-size="15" fill="#57534e">围度从 M(β) 上量出</text>
    <text x="696" y="672" font-size="14" fill="#b45309" font-weight="700">SDK 不当档案真相</text>

    <rect x="966" y="502" width="250" height="200" rx="16" fill="#fffdf8" stroke="#1c1917" stroke-width="2.5"/>
    <text x="986" y="542" font-size="21" font-weight="700" fill="#1c1917">4  驱动 GLB</text>
    <text x="986" y="578" font-size="15" fill="#57534e">β → morph 权重</text>
    <text x="986" y="606" font-size="15" fill="#57534e">身高走整体缩放</text>
    <text x="986" y="634" font-size="15" fill="#57534e">three.js 实时转侧面</text>
    <text x="986" y="672" font-size="14" fill="#b45309" font-weight="700">拖一下立刻变</text>

    <rect x="1256" y="502" width="250" height="200" rx="16" fill="#fffdf8" stroke="#1c1917" stroke-width="2.5"/>
    <text x="1276" y="542" font-size="21" font-weight="700" fill="#1c1917">5  看码</text>
    <text x="1276" y="578" font-size="15" fill="#57534e">手填尺码表（阶段 1～2）</text>
    <text x="1276" y="606" font-size="15" fill="#57534e">主码 + 部位诊断</text>
    <text x="1276" y="634" font-size="15" fill="#57534e">置信度 · 该拦就拦</text>
    <text x="1276" y="672" font-size="14" fill="#b45309" font-weight="700">选码才是产品</text>

    <rect x="1546" y="502" width="278" height="200" rx="16" fill="#fff7ed" stroke="#b45309" stroke-width="3"/>
    <text x="1566" y="542" font-size="21" font-weight="700" fill="#9a3412">用户看见的</text>
    <text x="1566" y="582" font-size="16" fill="#9a3412">「这是我的体型」</text>
    <text x="1566" y="612" font-size="16" fill="#9a3412">「这件衣服穿 M」</text>
    <text x="1566" y="642" font-size="16" fill="#9a3412">不看见 Maya、不看见 GPT</text>
    <text x="1566" y="676" font-size="14" fill="#b45309" font-weight="700">秒级，不是等工单</text>
  </g>
  <g fill="#b45309" font-size="32" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" text-anchor="middle">
    <text x="362" y="614">→</text>
    <text x="652" y="614">→</text>
    <text x="942" y="614">→</text>
    <text x="1232" y="614">→</text>
    <text x="1522" y="614">→</text>
  </g>

  <rect x="64" y="756" width="900" height="236" rx="22" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
  <rect x="88" y="740" width="220" height="34" rx="17" fill="#e11d48"/>
  <text x="198" y="763" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#fff">不要做成主路径</text>
  <g font-family="Noto Sans CJK SC, PingFang SC, sans-serif">
    <text x="96" y="812" font-size="20" font-weight="700" fill="#9f1239">每人拍照 → GPT 调 Maya → 雕一具新模 → 导回 App</text>
    <line x1="90" y1="800" x2="940" y2="800" stroke="#e11d48" stroke-width="2.5"/>
    <text x="96" y="850" font-size="16" fill="#9f1239">· Maya 不是 Web API：要许可、无头机、分钟级、很难扩</text>
    <text x="96" y="878" font-size="16" fill="#9f1239">· 大模型雕不出可复现的围度，档案对不齐、选码会漂</text>
    <text x="96" y="906" font-size="16" fill="#9f1239">· 原图进公有模型 = 隐私红线（糊脸、短存、不训练）</text>
    <text x="96" y="944" font-size="16" fill="#9f1239">· 用户要「拖一下立刻变」，不是等工厂工单</text>
  </g>

  <rect x="988" y="756" width="868" height="236" rx="22" fill="#fffdf8" stroke="#a8a29e" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="1012" y="740" width="168" height="34" rx="17" fill="#a8a29e"/>
  <text x="1096" y="763" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#fff">以后可选</text>
  <g font-family="Noto Sans CJK SC, PingFang SC, sans-serif">
    <text x="1016" y="812" font-size="22" font-weight="700" fill="#57534e">异步精渲染海报（阶段 4）</text>
    <text x="1016" y="850" font-size="16" fill="#57534e">同一组 β 丢给服务端（Maya / UE 离线渲）</text>
    <text x="1016" y="878" font-size="16" fill="#57534e">回传的是图或短视频，不是每人一具不可比网格</text>
    <text x="1016" y="906" font-size="16" fill="#57534e">排队、分钟级可以；绝不挡选码主路径</text>
    <text x="1016" y="944" font-size="16" fill="#0f766e" font-weight="700">精致可以加在同一套数据上，不必换故事</text>
  </g>

  <rect x="64" y="1012" width="1792" height="48" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="88" y="1044" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" fill="#115e59" font-weight="600">一句话：Maya 是工厂，β 是档案，GLB 是货架。客户看见货架上的人，看不见车间。</text>
</svg>
