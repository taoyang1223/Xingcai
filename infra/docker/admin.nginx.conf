server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        proxy_pass http://server:8080/healthz;
    }
    location /readyz {
        proxy_pass http://server:8080/readyz;
    }
    location /api/ {
        proxy_pass http://server:8080/api/;
    }
    location /admin/ {
        proxy_pass http://server:8080/admin/;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
