services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: fitme
      POSTGRES_PASSWORD: fitme
      POSTGRES_DB: fitme
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - fitme_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitme -d fitme"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  algo:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.algo
    environment:
      FITME_GRPC_ADDR: 0.0.0.0:9090
      FITME_HTTP_ADDR: 0.0.0.0:8090
    ports:
      - "8090:8090"
      - "19090:9090"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      algo:
        condition: service_started
    environment:
      FITME_ENV: dev
      FITME_HTTP_ADDR: :8080
      FITME_POSTGRES_DSN: postgres://fitme:fitme@postgres:5432/fitme?sslmode=disable
      FITME_REDIS_ADDR: redis:6379
      FITME_ALGO_GRPC_ADDR: algo:9090
      FITME_MIGRATIONS_DIR: /app/migrations
      FITME_CRYPTO_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  admin:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.admin
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  fitme_pg:
