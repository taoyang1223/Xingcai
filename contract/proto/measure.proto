syntax = "proto3";

package fitme.algo.v1;

option go_package = "github.com/taoyang1223/Xingcai/services/server/internal/shared/pb/measurev1;measurev1";

service MeasureService {
  rpc Measure (MeasureRequest) returns (MeasureResponse);
  rpc GetProviderHealth (Empty) returns (ProviderHealth);
}

message Empty {}

enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
}

message PhotoRef {
  string view = 1;
  string oss_key = 2;
}

message MeasureRequest {
  string job_uid = 1;
  Gender gender = 2;
  float height_cm = 3;
  float weight_kg = 4;
  repeated PhotoRef photos = 5;
  string provider_hint = 6;
}

message MeasureResponse {
  map<string, float> measurements = 1;
  map<string, float> confidence = 2;
  string mesh_key = 3;
  string provider_code = 4;
  int32 cost_ms = 5;
}

message ProviderHealth {
  string code = 1;
  bool healthy = 2;
  string message = 3;
}
